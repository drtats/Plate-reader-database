[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plate-reader-database"
version = "0.1.0"
description = "Modular Streamlit platform for growth-curve and MIC plate-reader data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "libsql>=0.1,<1",
    "numpy>=2.3,<3",
    "pandas>=2.3,<3",
    "plotly>=6.3,<7",
    "pyarrow>=25,<26",
    "pydantic>=2.11,<3",
    "pyturso>=0.7,<0.8",
    "streamlit[auth]>=1.54,<1.55",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]
packaging = [
    "pyinstaller>=6.16,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/plate_reader"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "app.py"]
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["libsql", "pandas", "plotly", "plotly.*", "pyarrow"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=plate_reader --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "remote: opt-in test requiring an isolated live Turso database",
]

[tool.coverage.run]
branch = true
source = ["plate_reader"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "class .*\\bProtocol\\):",
]
