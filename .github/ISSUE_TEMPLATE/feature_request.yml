name: Feature request
description: Propose a scoped capability or improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this address?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable acceptance behavior rather than implementation.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Growth analysis
        - MIC analysis
        - Database or migration
        - Import or export
        - UI or visualization
        - Deployment or packaging
        - Documentation or tooling
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Note local, cloud, standalone, schema, or legacy-format impact.
