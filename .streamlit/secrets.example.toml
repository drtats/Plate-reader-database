# Copy values into Streamlit Community Cloud secrets or an ignored
# .streamlit/secrets.toml. Never commit real values.
[auth]
redirect_uri = "https://REPLACE_WITH_APP_HOST/oauth2callback"
cookie_secret = "REPLACE_WITH_RANDOM_SECRET"

[auth.google]
client_id = "REPLACE_WITH_GOOGLE_CLIENT_ID"
client_secret = "REPLACE_WITH_GOOGLE_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# Use this instead of auth.google when Microsoft Entra is selected.
# [auth.microsoft]
# client_id = "REPLACE_WITH_MICROSOFT_CLIENT_ID"
# client_secret = "REPLACE_WITH_MICROSOFT_CLIENT_SECRET"
# server_metadata_url = "https://login.microsoftonline.com/REPLACE_TENANT/v2.0/.well-known/openid-configuration"
